version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pickie-postgres
    env_file:
      - ./postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: pickie-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: pickie-api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - api/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  datasource:
    build:
      context: .
      dockerfile: datasource/Dockerfile
    container_name: pickie-datasource
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - datasource/.env
    command: ["node", "dist/index.js"]

networks:
  default:
    name: pickie_net

